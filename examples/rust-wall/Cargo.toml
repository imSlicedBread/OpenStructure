[package]
name = "openstructure-rust-wall"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license-file = "../../LICENSE.pending"
[workspace]
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
os-plugin-api = { path = "../../crates/os-plugin-api", default-features = false }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
[lints.rust]
unsafe_code = "deny"
[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
